# fix-3
# Bouwt de Android-app (APK) van PdfReader.
# - Elke push naar fix-* of main (bij wijzigingen in android/ of deze workflow) en handmatig starten.
# - Resultaat: artifact "PdfReader-apk" bij elke run; bij main ook een GitHub Release met PdfReader.apk,
#   vaste downloadlink: https://github.com/bruindav/PdfReader/releases/latest/download/PdfReader.apk
name: Android-app

on:
  push:
    branches: ['fix-*', 'main']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Eigen sleutel klaarzetten (alleen als de secret bestaat)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Ondertekenen met de eigen sleutel uit de secrets."
          else
            echo "Geen secret ANDROID_KEYSTORE_BASE64: ondertekenen met de openbare ontwikkel-sleutel."
          fi

      - name: APK bouwen
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/PdfReader.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Handtekening controleren
        continue-on-error: true
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs "$GITHUB_WORKSPACE/PdfReader.apk" | grep -E 'Signer #1 certificate (DN|SHA-256)'

      - uses: actions/upload-artifact@v4
        with:
          name: PdfReader-apk
          path: PdfReader.apk
          if-no-files-found: error

      - name: Release maken (alleen main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" "$GITHUB_WORKSPACE/PdfReader.apk" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "PdfReader Android-app (build ${{ github.run_number }})" \
            --notes "Download PdfReader.apk en open het bestand op je telefoon. Zie de README, sectie Android-app." \
            --latest
